name: Release

# Cut a release by pushing a version tag, e.g.: git tag v0.1.0 && git push origin v0.1.0
# or run this workflow by hand (Actions -> Release -> Run workflow) on main with a version
# such as v0.1.33. A manual run creates that tag at the commit it built.
# Builds the --onedir agent on macOS (Apple Silicon) and Windows, then publishes the
# archives + SHA256SUMS to a GitHub Release. Asset names match install.sh / install.ps1
# / bridge/updater.py exactly. The tag is stamped into the frozen binary automatically;
# there is no separate version-bump commit to forget.
#
# Intel Macs (macos-13) are intentionally omitted: GitHub is deprecating the free Intel
# runners and they can sit queued for hours, hanging the whole release. install.sh guards
# x86_64 with a clear message. Re-add a macos-13 matrix entry (or a self-hosted runner)
# when Intel support is actually needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, vMAJOR.MINOR.PATCH (for example v0.1.33)'
        required: true

env:
  # The pushed tag, or the version typed into a manual run.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      target: macos-arm64,   kind: macos }
          - { os: windows-latest, target: windows-x86_64, kind: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp release version from tag
        run: python packaging/stamp_version.py "$RELEASE_TAG"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller certifi
      - name: Build (--onedir)
        run: >
          pyinstaller --onedir --noconfirm --name printforce-link
          --paths .
          --collect-submodules bridge
          --collect-submodules paho
          --hidden-import paho.mqtt.client
          --collect-data certifi
          packaging/entry.py
      - name: Smoke version (macOS)
        if: matrix.kind == 'macos'
        run: test "$(dist/printforce-link/printforce-link --version)" = "${RELEASE_TAG#v}"
      - name: Smoke version (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $expected = $env:RELEASE_TAG.TrimStart("v")
          $actual = & "dist/printforce-link/printforce-link.exe" --version
          if ($actual -ne $expected) { throw "Expected $expected, got $actual" }
      - name: Package (macOS)
        if: matrix.kind == 'macos'
        run: tar -czf "printforce-link-${{ matrix.target }}.tar.gz" -C dist printforce-link
      - name: Package (Windows)
        if: matrix.kind == 'windows'
        run: Compress-Archive -Path dist/printforce-link -DestinationPath "printforce-link-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: printforce-link-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect archives + checksums
        run: |
          mkdir release
          find artifacts -type f -name 'printforce-link-*' -exec cp {} release/ \;
          (cd release && sha256sum printforce-link-* > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # A manual run has no tag yet. The release creates it at the built commit.
          target_commitish: ${{ github.sha }}
          files: release/*
